<!doctype html>
<html lang="es">
  <head>
    <title>Algo no salió como esperábamos · Matr.IA</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <style>
      :root {
        color: #241d28;
        background: #f5f3fb;
        font-family: ui-rounded, "Avenir Next", "Nunito Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 90% 12%, rgba(226, 82, 139, .12), transparent 26rem),
          radial-gradient(circle at 8% 88%, rgba(109, 42, 145, .14), transparent 30rem),
          #f5f3fb;
      }
      .page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px clamp(24px, 6vw, 72px) 40px;
      }
      .brand {
        display: block;
        width: 150px;
        text-decoration: none;
      }
      .brand img { display: block; width: 100%; height: auto; }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: clamp(28px, 7vw, 92px);
        align-items: center;
        flex: 1;
        padding: 58px 0;
      }
      .illustration {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 230px;
      }
      .illustration::before,
      .illustration::after {
        position: absolute;
        border-radius: 50%;
        content: "";
      }
      .illustration::before {
        width: 230px;
        height: 230px;
        background: rgba(218, 197, 233, .62);
      }
      .illustration::after {
        width: 180px;
        height: 180px;
        border: 2px dashed rgba(98, 36, 123, .35);
      }
      .code {
        z-index: 1;
        color: #641879;
        font-size: clamp(5.5rem, 19vw, 10rem);
        font-weight: 900;
        letter-spacing: -.1em;
        line-height: .8;
        text-shadow: 7px 8px 0 rgba(237, 98, 137, .28);
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #6a2779;
        font-size: .82rem;
        font-weight: 800;
        letter-spacing: .1em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 610px;
        margin: 0;
        font-size: clamp(2.25rem, 6vw, 4.2rem);
        letter-spacing: -.055em;
        line-height: 1.02;
      }
      .copy {
        max-width: 520px;
        margin: 20px 0 0;
        color: #544b5a;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 12px 22px;
        color: white;
        background: linear-gradient(110deg, #551070, #9d53ab, #e95b84);
        border: 0;
        border-radius: 999px;
        box-shadow: 0 5px 0 rgba(85, 16, 112, .15);
        font-weight: 800;
        text-decoration: none;
      }
      .button--secondary {
        color: #5c2673;
        background: transparent;
        border: 1px solid rgba(92, 38, 115, .45);
        box-shadow: none;
      }
      .button:hover { transform: translateY(-2px); }
      .button:focus-visible { outline: 3px solid #5c1675; outline-offset: 4px; }
      footer {
        color: #716878;
        font-size: .9rem;
        text-align: center;
      }
      @media (min-width: 760px) {
        main { grid-template-columns: minmax(260px, .8fr) minmax(0, 1.2fr); }
        .illustration { min-height: 330px; }
        .illustration::before { width: 300px; height: 300px; }
        .illustration::after { width: 240px; height: 240px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <a class="brand" href="/" aria-label="Ir al inicio de Matr.IA">
        <img src="/images/logo.matria.png" alt="Matr.IA">
      </a>
      <main>
        <div class="illustration" aria-hidden="true"><div class="code">500</div></div>
        <section aria-labelledby="error-title">
          <p class="eyebrow">Error temporal</p>
          <h1 id="error-title">Algo no salió como esperábamos.</h1>
          <p class="copy">No pudimos cargar esta página en este momento. Tu información no se ha perdido; espera unos instantes e inténtalo de nuevo.</p>
          <div class="actions">
            <a class="button" href="">Intentar de nuevo</a>
            <a class="button button--secondary" href="/">Volver al inicio</a>
          </div>
        </section>
      </main>
      <footer>Gracias por tu paciencia. Estamos trabajando para que puedas continuar.</footer>
    </div>
  </body>
</html>
